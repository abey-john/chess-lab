name: Deploy chess-lab to GitHub Pages

# Deploys as a project site under the user site:
#   https://abey-john.github.io/chess-lab/
# vite.config.ts `base: '/chess-lab/'` must match the repository name.
# This repo's Pages deployment is independent of abey-john.github.io —
# GitHub routes /chess-lab/* to this repo and everything else to the user site.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-repository group: only serializes chess-lab deploys, never the user site's.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build chess-lab
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
